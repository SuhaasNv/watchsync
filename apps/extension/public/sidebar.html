<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WatchSync chat</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <header class="head">
      <h1>WatchSync</h1>
      <span class="code" id="code"></span>
      <button type="button" class="close" id="close" aria-label="Close chat" title="Close chat"></button>
    </header>
    <section class="body" id="body" aria-label="Chat">
      <p class="empty">Messages from the room show up here.</p>
    </section>
    <script src="sidebar.js"></script>
  </body>
</html>
