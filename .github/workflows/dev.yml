name: Dev build

# Every push to dev refreshes the "WatchSync Dev" zip testers download (DEC-026): one rolling
# pre-release, tag dev-latest, pointed at the commit it was built from. It does not wait for
# CI (about 15 minutes of browser tests): CI runs beside it on the same push and shows red if
# something is wrong, and testers know it is a testing build. A release still runs the full CI
# first (release.yml). The extension's update check compares that commit with its own.
# Production never reads it: /releases/latest skips pre-releases.
on:
  push:
    branches: [dev]

concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # replace the dev-latest release and its tag
    env:
      SHA: ${{ github.sha }}
      WATCHSYNC_API: ${{ vars.DEV_API_URL }}
      WATCHSYNC_SITE: ${{ vars.DEV_SITE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Pack WatchSync Dev
        run: |
          if [ -z "$WATCHSYNC_API" ]; then
            echo "::error::Set the repository variable DEV_API_URL to the dev room service URL."
            exit 1
          fi
          pnpm --filter @watchsync/extension zip:dev
          unzip -p apps/extension/watchsync-extension-dev.zip manifest.json | node -e '
            const m = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (m.name !== "WatchSync Dev") throw new Error("not a dev build: " + m.name);
            if (m.host_permissions.some((p) => p.includes("localhost"))) throw new Error("localhost in a dev build");
            console.log(m.name + " " + m.version_name + ", hosts " + m.host_permissions.join(" "));'

      - name: Replace the dev-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${SHA:0:7}"
          version=$(node -p "require('./apps/extension/package.json').version")
          label=$(node -p "const p = require('./apps/extension/package.json'); p.prerelease ? p.version + '-' + p.prerelease : p.version")
          # What is in this build: the CHANGELOG section being worked on (Unreleased, else the
          # version in package.json), in the same plain words as a release.
          changes=$(node scripts/release-notes.mjs Unreleased 2>/dev/null || node scripts/release-notes.mjs "$version" 2>/dev/null || true)
          {
            echo "A testing build of WatchSync **$label** from the dev branch, commit \`$short\`. It is not a release: for everyday use install WatchSync from https://watchsync.space."
            echo
            echo "## In this build"
            echo
            if [ -n "$changes" ]; then echo "$changes"; else echo "No notes yet for this version. See CHANGELOG.md in the repository."; fi
            echo
            echo "## Install or update"
            echo
            echo "- Download \`watchsync-extension-dev.zip\` below and unzip it. To update, unzip over the same folder."
            echo "- Open chrome://extensions, turn on Developer mode, choose Load unpacked and pick the folder. To update, press the reload arrow on the WatchSync Dev card."
            echo "- The name on that card reads \"WatchSync Dev\" and its version reads \"$label dev $short\"."
            echo
            echo "## Good to know"
            echo
            echo "- It talks to the dev room service, which sleeps when idle, so the first room can take a few seconds."
            echo "- Rooms on the dev service and on watchsync.space are separate: everyone in a room needs the same build."
          } > dev-notes.md
          cat dev-notes.md
          gh release delete dev-latest --cleanup-tag --yes > /dev/null 2>&1 || true
          gh release create dev-latest apps/extension/watchsync-extension-dev.zip \
            --prerelease --latest=false --target "$SHA" \
            --title "WatchSync Dev $label ($short)" \
            --notes-file dev-notes.md
