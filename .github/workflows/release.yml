name: Release

# Pushing a tag vX.Y.Z, vX.Y.Z-rc.N or vX.Y.Z-beta.N (owner approval each time, see docs/RELEASING.md) runs the
# full CI, packs the extension against the production room service and publishes a GitHub
# Release with the zip, its SHA-256 checksums and a signed build provenance attestation. The notes
# are the matching CHANGELOG.md section plus the commit, the run and the checksums, so anyone can
# check the zip they downloaded is the one this workflow built.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    # A called workflow gets at most these; CI's secrets job reads pull requests.
    permissions:
      contents: read
      pull-requests: read

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the build provenance attestation (Sigstore)
      attestations: write # store the attestation, for `gh attestation verify`
    env:
      TAG: ${{ github.ref_name }}
      # Production room service; set PROD_API_URL once api.watchsync.space is live.
      WATCHSYNC_API: ${{ vars.PROD_API_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }

      # Production moves only at a release, from main (DEC-026). Testing builds come from dev.
      - name: Tag is on main
        run: |
          # A beta is a pre-release for testers and moves nothing in production, so it may come
          # from dev; release candidates and finals come from main.
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then exit 0; fi
          if [[ "$TAG" == *-beta.* ]] && git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then exit 0; fi
          echo "::error::$TAG is not on main. Merge dev into main first (Ship use case), then tag."
          exit 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The tag, the version and the "prerelease" label in apps/extension/package.json must agree,
      # and a final release must be its last release candidate unchanged (docs/RELEASING.md).
      - name: Tag matches the build, and a final is its last candidate
        id: version
        run: |
          git fetch --tags --force
          node scripts/release-guard.mjs "$TAG"
          base="${TAG#v}"
          base="${base%%-*}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-beta.*) echo "kind=beta" >> "$GITHUB_OUTPUT"; echo "title=WatchSync $TAG (beta)" >> "$GITHUB_OUTPUT" ;;
            *-rc.*) echo "kind=rc" >> "$GITHUB_OUTPUT"; echo "title=WatchSync $TAG (release candidate)" >> "$GITHUB_OUTPUT" ;;
            *) echo "kind=final" >> "$GITHUB_OUTPUT"; echo "title=WatchSync $TAG" >> "$GITHUB_OUTPUT" ;;
          esac

      # Fail before packing when CHANGELOG.md has no section for this version.
      - name: CHANGELOG.md has notes for this version
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.base }}" > /dev/null

      - name: Pack the extension (production room service)
        run: |
          pnpm --filter @watchsync/extension zip
          zip="apps/extension/watchsync-extension-v${{ steps.version.outputs.base }}.zip"
          # The website links to releases/latest/download/watchsync-extension.zip, so every
          # release carries the zip under that stable name as well as a versioned one.
          cp "$zip" watchsync-extension.zip
          cp "$zip" "watchsync-extension-$TAG.zip"
          unzip -p watchsync-extension.zip manifest.json | node -e '
            const m = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (m.host_permissions.some((p) => p.includes("localhost"))) throw new Error("localhost in a release build");
            console.log("manifest " + m.version + ", hosts " + m.host_permissions.join(" "));'

      - name: Checksums
        run: |
          sha256sum watchsync-extension.zip "watchsync-extension-$TAG.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signs which repository, workflow and commit built the zip:
      # gh attestation verify watchsync-extension.zip -R SuhaasNv/watchsync
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            watchsync-extension.zip
            watchsync-extension-${{ github.ref_name }}.zip

      - name: Release notes (CHANGELOG.md, build and checksums)
        run: |
          node scripts/release-notes.mjs "${{ steps.version.outputs.base }}" \
            --checksums SHA256SUMS.txt \
            --commit "$GITHUB_SHA" \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > release-notes.md
          cat release-notes.md

      # Release candidates and finals are published as normal releases, not --prerelease, on
      # purpose: GitHub's /releases/latest (the website's download link and the popup's update
      # check) skips prereleases, and friends testing install the candidate from the website.
      # A beta is the other way round, like an Apple beta: a pre-release that the website's
      # download link and the update check never pick, for the testers who are sent its link.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.version.outputs.title }}
          KIND: ${{ steps.version.outputs.kind }}
        run: |
          files=(watchsync-extension.zip "watchsync-extension-$TAG.zip" SHA256SUMS.txt)
          if [ "$KIND" = beta ]; then flags=(--prerelease --latest=false); else flags=(--latest); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run after a partial failure: refresh the files, keep the release. A rebuilt zip
            # has new checksums, so the notes are refreshed with them.
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "${files[@]}" --verify-tag "${flags[@]}" \
              --title "$TITLE" --notes-file release-notes.md
          fi
