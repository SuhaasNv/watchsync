name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Protocol is generated from the schema
        run: pnpm gen:protocol && git diff --exit-code -- packages/protocol/src/generated
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @watchsync/extension build
      - uses: astral-sh/setup-uv@v6
      - name: Room service for end-to-end
        working-directory: services/signaling
        run: uv sync --frozen
      - name: Extension end-to-end (mock player)
        working-directory: apps/extension
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Keep the end-to-end report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/extension/playwright-report
            apps/extension/test-results
          retention-days: 7

  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signaling
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app
      - name: Unit and integration tests (HTTP and WebSocket through the real app)
        run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
