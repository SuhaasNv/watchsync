name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # The release workflow runs these same checks before it builds a release.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default (BUG-043); a job that needs more declares it.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Protocol is generated from the schema
        run: pnpm gen:protocol && git diff --exit-code -- packages/protocol/src/generated
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @watchsync/extension build
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Room service for end-to-end
        working-directory: services/signaling
        run: uv sync --frozen
      - name: Extension end-to-end (mock player)
        working-directory: apps/extension
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Keep the end-to-end report when something fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/extension/playwright-report
            apps/extension/test-results
          retention-days: 7

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @watchsync/website build
      - name: Website end-to-end (every page, axe WCAG 2.2 AA, 375 to 1440 px)
        working-directory: apps/website
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" pnpm exec playwright install --with-deps chromium
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" pnpm e2e
      - name: The dev channel builds too
        run: PUBLIC_CHANNEL=dev pnpm --filter @watchsync/website exec astro build --outDir /tmp/dev-site
      - name: Website image builds
        run: docker build -f Dockerfile.website -t watchsync-website .
      - name: Room service image builds
        run: docker build -f Dockerfile.signaling -t watchsync-room-service .

  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signaling
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app
      - name: Unit and integration tests (HTTP and WebSocket through the real app)
        run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists a pull request's commits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
